# Python packaging for the options-trading-platform.
#
# Tooling choice: **uv** (see py/README.md for the full rationale). In short:
# one fast tool covers virtualenv + dependency resolution + a committed lockfile
# (uv.lock) + PEP 517 builds, which keeps the reproducible-env story simple.
#
# S0-T1 scope: build substrate only. No research/pricing/strategy code here yet.
[project]
name = "t-plat"
version = "0.0.0"
description = "Python build-substrate package for the options trading platform (S0-T1)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Dev toolchain used by the `just` lint/test targets. Pinned via uv.lock.
dev = [
    "maturin>=1.9,<2",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t_plat"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benches"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "benches"]
