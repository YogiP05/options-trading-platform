# `prod` profile — deployed environments (S0-T5).
#
# Precedence layer 3 of 5, selected by `T_PLAT_PROFILE=prod`.
# Overlays config/default.toml. NON-SECRET ONLY — this file is committed, so it
# holds only hostnames, timeouts and secret *references*.
#
# Local-vs-prod split (behavioural, enforced by the loader — see config/README.md):
#   * secret policy is REQUIRED — every declared secret must resolve at load
#     time, so a missing credential fails fast at boot instead of at first use;
#   * `app.debug = true` is rejected.

[app]
log_level = "info"
debug = false

[database]
host = "db.internal"
port = 5432
name = "t_plat"
user = "t_plat"
# Injected by the deployment environment (env var), never stored here.
password = "env:T_PLAT_DATABASE_PASSWORD"

[market_data]
endpoint = "https://market-data.internal"
timeout_ms = 2000
max_retries = 5
# Mounted by the secret store (Docker/K8s secret), never stored here.
api_key = "file:/run/secrets/t_plat_market_data_api_key"

[telemetry]
enabled = true
otlp_endpoint = "http://otel-collector.internal:4317"
sample_rate = 0.1
