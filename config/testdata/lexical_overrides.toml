# SHARED CROSS-LANGUAGE PARITY FIXTURE — override string grammar (S0-T5).
#
# Companion to numeric_bounds.toml. That fixture pins the *value ranges*; this
# one pins the *lexical grammar*: exactly which raw strings become a value at
# all. Same case schema, same two test suites, same engine:
#
#   rust/crates/platform-config/tests/parity_bounds.rs
#   py/tests/test_config_bounds_parity.py
#
# Why this file exists: environment overrides arrive as strings, so how a string
# becomes a value is part of the shared schema. Delegating that to each
# language's standard library silently split the two implementations — Python's
# int()/float() accept `1_0`, Arabic-Indic and full-width digits, and Python's
# str.strip and Rust's str::trim disagree about characters like U+001F. Both
# loaders now implement one explicit ASCII grammar and neither trims:
#
#   integer  [+-]?[0-9]+
#   float    [+-]?( inf | infinity | nan | ([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+)? )
#   boolean  exact ASCII-lowercased match of true/1/yes/on | false/0/no/off
#   string   taken verbatim, never trimmed
#
# `accept` is the outcome of the whole load, so a case can be lexically valid
# and still rejected on range (e.g. `1e3` for a 0.0..=1.0 ratio).

# --- integer grammar, on database.port --------------------------------------

[[case]]
name = "lex-int-underscore-separator"
var = "T_PLAT__DATABASE__PORT"
value = "1_0"
accept = false
why = "Python's int() reads this as 10; Rust's parse rejects it. The original divergence."

[[case]]
name = "lex-int-leading-space"
var = "T_PLAT__DATABASE__PORT"
value = " 10"
accept = false
why = "neither language trims overrides"

[[case]]
name = "lex-int-trailing-space"
var = "T_PLAT__DATABASE__PORT"
value = "10 "
accept = false
why = "neither language trims overrides"

[[case]]
name = "lex-int-trailing-newline"
var = "T_PLAT__DATABASE__PORT"
value = "10\n"
accept = false
why = "a regex anchored with $ would have let this through in Python; fullmatch does not"

[[case]]
name = "lex-int-unit-separator"
var = "T_PLAT__DATABASE__PORT"
value = "\u001F10"
accept = false
why = "Python's str.strip removes U+001F, Rust's str::trim does not — exactly where the two stripping rules part"

[[case]]
name = "lex-int-non-breaking-space"
var = "T_PLAT__DATABASE__PORT"
value = "\u00A010"
accept = false
why = "Rust's str::trim removes U+00A0, Python's str.strip also does; the grammar removes the question"

[[case]]
name = "lex-int-explicit-plus"
var = "T_PLAT__DATABASE__PORT"
value = "+10"
accept = true
expect_int = 10
why = "a single leading sign is part of the grammar in both languages"

[[case]]
name = "lex-int-leading-zeroes"
var = "T_PLAT__DATABASE__PORT"
value = "010"
accept = true
expect_int = 10
why = "decimal with leading zeroes, not octal — Rust reads 10, so Python must too"

[[case]]
name = "lex-int-hex-prefix"
var = "T_PLAT__DATABASE__PORT"
value = "0x10"
accept = false
why = "no radix prefixes in either language"

[[case]]
name = "lex-int-negative"
var = "T_PLAT__DATABASE__PORT"
value = "-1"
accept = false
why = "lexically valid, then rejected by the port range"

[[case]]
name = "lex-int-arabic-indic-digits"
var = "T_PLAT__DATABASE__PORT"
value = "\u0661\u0660"
accept = false
why = "Python's int() reads these as 10; Rust rejects non-ASCII digits"

[[case]]
name = "lex-int-fullwidth-digits"
var = "T_PLAT__DATABASE__PORT"
value = "\uFF11\uFF10"
accept = false
why = "Python's int() reads these as 10; Rust rejects non-ASCII digits"

[[case]]
name = "lex-int-empty"
var = "T_PLAT__DATABASE__PORT"
value = ""
accept = false
why = "no digits"

[[case]]
name = "lex-int-lone-plus"
var = "T_PLAT__DATABASE__PORT"
value = "+"
accept = false
why = "sign with no digits"

[[case]]
name = "lex-int-lone-minus"
var = "T_PLAT__DATABASE__PORT"
value = "-"
accept = false
why = "sign with no digits"

[[case]]
name = "lex-int-double-sign"
var = "T_PLAT__DATABASE__PORT"
value = "++1"
accept = false
why = "at most one leading sign"

[[case]]
name = "lex-int-internal-space"
var = "T_PLAT__DATABASE__PORT"
value = "1 0"
accept = false
why = "digits must be contiguous"

[[case]]
name = "lex-int-thousands-separator"
var = "T_PLAT__DATABASE__PORT"
value = "1,0"
accept = false
why = "no grouping separators"

[[case]]
name = "lex-int-decimal-form"
var = "T_PLAT__DATABASE__PORT"
value = "10.0"
accept = false
why = "an integer field does not accept a decimal spelling"

[[case]]
name = "lex-int-exponent-form"
var = "T_PLAT__DATABASE__PORT"
value = "1e1"
accept = false
why = "an integer field does not accept exponent notation"

# --- integer grammar, on market_data.timeout_ms -----------------------------
