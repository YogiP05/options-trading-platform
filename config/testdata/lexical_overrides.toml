[[case]]
name = "lex-timeout-underscore-separator"
var = "T_PLAT__MARKET_DATA__TIMEOUT_MS"
value = "1_0"
accept = false
why = "same grammar as every other integer field"

[[case]]
name = "lex-timeout-leading-space"
var = "T_PLAT__MARKET_DATA__TIMEOUT_MS"
value = " 5000"
accept = false
why = "no trimming, on every integer field"

[[case]]
name = "lex-timeout-arabic-indic-digits"
var = "T_PLAT__MARKET_DATA__TIMEOUT_MS"
value = "\u0661\u0660"
accept = false
why = "no non-ASCII digits, on every integer field"

[[case]]
name = "lex-timeout-hex-prefix"
var = "T_PLAT__MARKET_DATA__TIMEOUT_MS"
value = "0x10"
accept = false
why = "no radix prefixes, on every integer field"

[[case]]
name = "lex-timeout-explicit-plus"
var = "T_PLAT__MARKET_DATA__TIMEOUT_MS"
value = "+2500"
accept = true
expect_int = 2500
why = "a single leading sign is accepted on every integer field"

