# --- float grammar, on telemetry.sample_rate --------------------------------

[[case]]
name = "lex-float-underscore-before-point"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "0_.5"
accept = false
why = "rejected by both, but only by accident before the grammar was pinned"

[[case]]
name = "lex-float-underscore-in-fraction"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "0.5_0"
accept = false
why = "Python's float() reads this as 0.5; Rust rejects it. The float-side divergence."

[[case]]
name = "lex-float-leading-space"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = " 0.5"
accept = false
why = "neither language trims overrides"

[[case]]
name = "lex-float-trailing-space"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "0.5 "
accept = false
why = "neither language trims overrides"

[[case]]
name = "lex-float-surrounding-space"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = " 0.5 "
accept = false
why = "neither language trims overrides"

[[case]]
name = "lex-float-unit-separator"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "\u001F0.5"
accept = false
why = "Python's str.strip removes U+001F, Rust's str::trim does not"

[[case]]
name = "lex-float-arabic-indic-digits"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "\u0660.\u0665"
accept = false
why = "Python's float() reads these as 0.5; Rust rejects non-ASCII digits"

[[case]]
name = "lex-float-exponent-out-of-range"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "1e3"
accept = false
why = "lexically valid exponent notation in both, then rejected as outside 0.0..=1.0"

[[case]]
name = "lex-float-exponent-in-range"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "5e-1"
accept = true
expect_float = 0.5
why = "exponent notation is accepted identically by both grammars"

[[case]]
name = "lex-float-leading-point"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = ".5"
accept = true
expect_float = 0.5
why = "Rust's f64 grammar allows a bare fractional part, so Python must too"

[[case]]
name = "lex-float-trailing-point"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "0."
accept = true
expect_float = 0.0
why = "Rust's f64 grammar allows a trailing point, so Python must too"

[[case]]
name = "lex-float-explicit-plus"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "+0.5"
accept = true
expect_float = 0.5
why = "a single leading sign is part of the grammar in both languages"

[[case]]
name = "lex-float-lone-point"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "."
accept = false
why = "at least one digit is required on some side of the point"

[[case]]
name = "lex-float-empty"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = ""
accept = false
why = "no digits"

[[case]]
name = "lex-float-lone-plus"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "+"
accept = false
why = "sign with no digits"

[[case]]
name = "lex-float-hex"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "0x1p3"
accept = false
why = "no hexadecimal float literals in either language"

[[case]]
name = "lex-float-exponent-missing-digits"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "1e"
accept = false
why = "an exponent marker needs digits"

[[case]]
name = "lex-float-double-point"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "1.2.3"
accept = false
why = "one point at most"

[[case]]
name = "lex-float-infinity-word"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "infinity"
accept = false
why = "Rust's f64 parses this spelling, so both grammars accept it — then both reject it as non-finite"

[[case]]
name = "lex-float-infinity-uppercase"
var = "T_PLAT__TELEMETRY__SAMPLE_RATE"
value = "INF"
accept = false
why = "non-finite spellings are case-insensitive in both, and rejected by value in both"

# --- boolean grammar, on app.debug ------------------------------------------

[[case]]
name = "lex-bool-true"
var = "T_PLAT__APP__DEBUG"
value = "true"
accept = true
expect_bool = true
why = "the canonical spelling"

[[case]]
name = "lex-bool-uppercase"
var = "T_PLAT__APP__DEBUG"
value = "TRUE"
accept = true
expect_bool = true
why = "ASCII case-insensitive in both"

[[case]]
name = "lex-bool-one"
var = "T_PLAT__APP__DEBUG"
value = "1"
accept = true
expect_bool = true
why = "numeric spelling accepted by both"

[[case]]
name = "lex-bool-off"
var = "T_PLAT__APP__DEBUG"
value = "off"
accept = true
expect_bool = false
why = "falsy spelling accepted by both"

[[case]]
name = "lex-bool-leading-space"
var = "T_PLAT__APP__DEBUG"
value = " true"
accept = false
why = "booleans are not trimmed either"

[[case]]
name = "lex-bool-trailing-space"
var = "T_PLAT__APP__DEBUG"
value = "true "
accept = false
why = "booleans are not trimmed either"

[[case]]
name = "lex-bool-unit-separator"
var = "T_PLAT__APP__DEBUG"
value = "\u001Ftrue"
accept = false
why = "the str.strip / str::trim divergence, on the boolean path"

[[case]]
name = "lex-bool-empty"
var = "T_PLAT__APP__DEBUG"
value = ""
accept = false
why = "not a boolean spelling"

# --- string passthrough, on app.log_level -----------------------------------
#
# Strings are the one type with no coercion. These cases pin that they are
# taken verbatim in both languages rather than trimmed.

[[case]]
name = "lex-string-verbatim"
var = "T_PLAT__APP__LOG_LEVEL"
value = "trace"
accept = true
expect_string = "trace"
why = "an ordinary string override"

[[case]]
name = "lex-string-leading-space-not-trimmed"
var = "T_PLAT__APP__LOG_LEVEL"
value = " info"
accept = false
why = "strings are not trimmed, so this is not the log level `info` in either language"
